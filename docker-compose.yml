version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lspot_postgres
    environment:
      POSTGRES_DB: lspot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - lspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lspot_redis
    ports:
      - "6379:6379"
    volumes:
      - lspot_redisdata:/data
    restart: unless-stopped

volumes:
  lspot_pgdata:
  lspot_redisdata:
